name: Football Unfiltered

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-unfiltered
  cancel-in-progress: false

jobs:
  football:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: Run Football Unfiltered bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python football_automation.py

      - name: Save duplicate trackers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posted_upcoming_matches.json

          if [ -f posted_match_eve.json ]; then
            git add posted_match_eve.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update upcoming and match-eve trackers"
            git push
          fi
