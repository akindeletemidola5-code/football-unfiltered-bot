      - name: Save duplicate trackers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posted_upcoming_matches.json

          if [ -f posted_match_eve.json ]; then
            git add posted_match_eve.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update upcoming and match-eve trackers"
            git push
          fi
