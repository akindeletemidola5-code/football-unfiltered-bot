name: Football Unfiltered

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-unfiltered
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install pillow requests

      - name: Run Football Unfiltered
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python football_automation.py

      - name: Save duplicate tracker
        run: |
          if [ -f posted_upcoming_matches.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posted_upcoming_matches.json

            if ! git diff --cached --quiet; then
              git commit -m "Update posted match tracker"
              git push
            fi
          fi
